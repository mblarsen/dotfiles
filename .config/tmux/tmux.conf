set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'kristijanhusak/tmux-simple-git-status'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# Mouse: click panes, scroll buffer, drag borders
set -g mouse on

# Index from 1 (not 0), renumber on close to avoid gaps
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Vi copy mode (v=select, V=line, y=yank, Esc=cancel)
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# 10ms escape delay — prevents Neovim normal-mode lag
set -sg escape-time 10

# Forward focus events to Neovim (CursorHold, autoread, etc.)
set -g focus-events on

# Cursor shape passthrough (block/line/beam follows Neovim mode)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# CSI-u extended keys — required for pi's Shift+Enter, Ctrl+Enter
set -s extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'wezterm*:extkeys'

# To see the links under tmux (3.4+), tmux must know the outer terminal supports hyperlinks. It detects this automatically when the terminal's terminfo announces the Hls capability.
# For terminals that don't (e.g. Ghostty), it needs to be set manually:
set -as terminal-features '*:hyperlinks'

# 256-color + passthrough for true-color and kitty graphics
set -g default-terminal "tmux-256color"
set -g allow-passthrough on

# Pane navigation via prefix + h/j/k/l (tmux-pain-control)
# No prefix-free C-h/j/k/l — they conflict with pi keybindings

# prefix + |/— — split horizontal/vertical (inherits cwd)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Kill pane and window preferences
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind-key X kill-window # prefix + Shift+X to kill the entire window
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# Pop up workmux
bind-key -n M-s run-shell "workmux sidebar"
bind-key -n M-f run-shell "~/.config/tmux/scripts/workmux-sidebar-filter-next"
bind-key -n M-e display-popup -w 70% -h 90% -E "workmux dashboard"

# Pop up zoxide (does the same as sesh)  
unbind-key g
bind-key g display-popup -w 40% -h 40% -E "tv zoxide-tmux --no-preview"

# Pop up sesh (does the same as zoxide) 
bind-key "space" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh

# Styles
set -g @red "#cc6666"
set -g @red_dark "#a35252"
set -g @black "#000000"
set -g @white "#aaaacc"
set -g @tinted_gray_light "#7a7aa0"
set -g @tinted_gray "#5c5c88"
set -g @tinted_gray_dark "#3f3f61"

# Prefix highlight
set -g @prefix_highlight_fg '#{@black}'
set -g @prefix_highlight_bg '#{@red}'
set -g @prefix_highlight_prefix_prompt 'Leader'

set -g status-interval 4
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "fg=#{@tinted_gray},bg=default"
set -g status-left " #{prefix_highlight} #[fg=#{@red_dark},bold] #S#[fg=#{@tinted_gray_dark},nobold]  "
set -g status-right '#[fg=#{@red}]#{?window_zoomed_flag, 󰵉  , }#{codex_usage} #[fg=#{@tinted_gray_dark}]#(cd "#{pane_current_path}" 2>/dev/null && b=$(git branch --show-current 2>/dev/null) && [ -n "$b" ] && printf " ")#[fg=#{@tinted_gray_light},bold]#(cd "#{pane_current_path}" 2>/dev/null && git branch --show-current 2>/dev/null)  #[fg=#{@tinted_gray_dark}]󰗲 #[fg=#{@tinted_gray_light},bold]#{battery}  #[fg=#{@tinted_gray_dark},nobold] #[fg=#{@tinted_gray_light},bold]%H:%M '
set -g window-status-current-format "#[fg=#{@white},bold]#I:#W"
set -g window-status-format "#[fg=#{tinted_gray},nobold]#I:#W"
set -g message-style "bg=#{@tinted_gray_dark},fg=#{@white}"
set -g mode-style "bg=#{@tinted_gray_dark},fg=#{@white}"

# Pane
set -g pane-border-style "fg=#{@tinted_gray_dark} bg=default"          # Inactive pane color
set -g pane-active-border-style "fg=#{@tinted_gray_light} bg=default"

# Toggle zen mode using Prefix + Enter
bind Enter run-shell "~/.config/tmux/scripts/zen 120" \; set status


# Load modules
run '~/.config/tmux/plugins/tpm/tpm'
